name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 创建 Release 需要 contents: write 权限（仓库默认只读会导致 Release 步骤失败）
permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run unit & component tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Prepare portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableDir = "src-tauri/target/release/portable-build"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item src-tauri/target/release/InklingMD.exe "$portableDir/InklingMD.exe"
          # 便携模式标记文件：存在则启用绿色模式，数据写入同目录 data 文件夹
          Set-Content -Path "$portableDir/portable.txt" -Value "This marker file enables portable mode. Keep it next to InklingMD.exe. App data will be stored in the 'data' folder beside the exe."
          Compress-Archive -Path "$portableDir/*" -DestinationPath "src-tauri/target/release/InklingMD-${version}-portable.zip" -Force
          Write-Host "Portable zip: InklingMD-${version}-portable.zip"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: InklingMD-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/InklingMD-*-portable.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/InklingMD-*-portable.zip
          generate_release_notes: true
