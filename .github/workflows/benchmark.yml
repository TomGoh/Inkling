name: Benchmark

# 独立工作流，刻意不改 build.yml：
# on: pull_request 作用于整个 workflow，在 build.yml 上加会让每个 PR 触发
# build-windows / build-linux 的完整 Tauri 双平台打包（每 PR 十几分钟成本），
# 而仓库现状「PR 不跑 CI」很可能是刻意的成本控制。独立工作流零副作用。
#
# 测量声明（防「CI 说没回归、用户说卡」的扯皮）：
# - 运行时 = Playwright chromium + vite dev server（未压缩、含 HMR），绝对值不代表生产构建
# - CI 无 GPU、仅 ubuntu-latest，测量值只用于同环境纵向对比
# - 真机 WebView2 / WKWebView 表现仍是发版前人工验证项

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "档位（quick = 1k/5k 行；full = 含 2 万行）"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - full
      update_baseline:
        description: "用本次结果重建 baseline（CI 首次启用、或 fixture/环境变更后需要）"
        required: false
        default: false
        type: boolean
      absolute:
        description: "启用绝对阈值判定（默认关闭：CI 无 GPU 且 vsync 锁 60Hz，绝对结论反映 runner 而非代码）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # PR 运行保持「不阻断合并」（issue #216 硬要求：只提示、不门禁）；
    # tag 运行是**发版验证**，必须显式失败——否则"回归复现"与"根本没比出结论"都会被绿勾掩盖。
    # tag 运行不会影响 build.yml 的 release job（两者是独立工作流），这里只控制本工作流的结论。
    continue-on-error: ${{ github.ref_type != 'tag' }}
    outputs:
      # 有疑似回归时把复测交给下面独立的 retest job（新 runner），见 jobs.retest 的说明
      suspects: ${{ steps.verdict.outputs.suspects }}
      profile: ${{ steps.profile.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright system deps
        shell: bash
        # sudo 会重置 PATH 导致找不到 pnpm，用 sudo env 透传（与 build.yml 一致）
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: 决定档位
        id: profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmark
        env:
          PERF_PROFILE: ${{ steps.profile.outputs.value }}
          CI: "true"
          # 不硬编码 0：留空表示"不覆盖默认策略"。CI 是 headless，默认策略本就不产出绝对判定
          # （vsync 锁 60Hz，绝对结论衡量 runner 而非代码；实测同代码两轮 jankRate 21.7% vs <10%）。
          # 相对回归判定（median / p95 / jank 对 baseline）在 CI 全量保留。
          # 需要绝对结论时勾选 absolute 输入，或本地用 PERF_HEADED=1 / PERF_UNCAPPED=1 跑。
          PERF_ABSOLUTE: ${{ github.event.inputs.absolute == 'true' && '1' || '' }}
          # tag 运行（发版验证）必须真的和基线比出结论：覆盖不足时 report 退出 2（不构成性能验证）
          PERF_REQUIRE_COMPARISON: ${{ github.ref_type == 'tag' && '1' || '' }}
          # 拆出独立复测 job（issue #234）：同 runner 顺序复测无法过滤"整台 runner 变慢"的会话，
          # 慢会话会让首轮与复测同时超阈值、穿过「连续 2 次」过滤。有嫌疑时本 job 只测+check，
          # 复测与 final 判定交给 retest job 在新 runner 上跑。
          PERF_SPLIT_RETEST: "1"
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            pnpm run benchmark -- --update-baseline=1
          else
            pnpm run benchmark
          fi

      # 判定是否需要独立复测 job：retest.json 有内容即为"有嫌疑"
      - name: 判定是否需要独立复测
        id: verdict
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          N=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('.perf-output/retest.json','utf8')).length)}catch{console.log(0)}")
          echo "疑似场景数=$N"
          if [ "$N" -gt 0 ]; then
            echo "suspects=true" >> "$GITHUB_OUTPUT"
          else
            echo "suspects=false" >> "$GITHUB_OUTPUT"
          fi

      # 退出码 1 = 回归复现，2 = infra 故障；两者都不阻断合并，但要留下产物供排查
      # 重建 baseline 时把 .perf-baseline/ 一并上传：CI 上的 baseline 需要人工取回并提交，
      # workflow 不自动 commit（避免给 CI 写仓库权限）
      #
      # include-hidden-files 必须为 true：.perf-output/ 与 .perf-baseline/ 都是点开头的隐藏目录，
      # upload-artifact v4+ 默认跳过隐藏文件——实测踩过「步骤显示 success 但零产物」的假绿灯。
      - name: Upload benchmark artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark-${{ steps.profile.outputs.value }}
          path: |
            .perf-output/
            .perf-baseline/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: 写入 Job Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f .perf-output/report.md ]; then
            COVERAGE=$(grep -oE '判定覆盖：[0-9]+/[0-9]+' .perf-output/report.md | head -1 || true)
            {
              echo "## 性能 Benchmark（档位：${{ steps.profile.outputs.value }}）"
              echo ""
              if [ -n "$COVERAGE" ]; then
                echo "**$COVERAGE**"
              fi
              # 覆盖面 banner：0/N 时「FAIL：0」会被误读成"没有回归"，必须点明
              case "$COVERAGE" in
                "判定覆盖：0/"*)
                  echo ""
                  echo "> ⚠️ **本次未与任何基线比较**：结论**不构成性能验证**。请先建立该档位基线（workflow_dispatch 勾选 update_baseline，取回产物后提交）。"
                  ;;
              esac
              echo ""
              cat .perf-output/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f .perf-output/retest.json ]; then
            # 移交模式（issue #234）：本 job 只做测量 + check，final 判定在 retest job 里出
            {
              echo "## 性能 Benchmark（档位：${{ steps.profile.outputs.value }}）"
              echo ""
              echo "⏳ 检出疑似回归，复测与 final 判定已移交独立的 **retest job**（新 runner）——"
              echo "同 runner 顺序复测无法过滤「整台 runner 变慢」的会话（#234）。"
              echo ""
              echo "**疑似场景**："
              echo ""
              node -e "const l=JSON.parse(require('fs').readFileSync('.perf-output/retest.json','utf8'));console.log(l.map(x=>'- \`'+x+'\`').join('\n'))"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ 未生成 .perf-output/report.md（benchmark 未跑完，属 infra 故障）" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 独立复测 job（issue #234）：在**新的 runner** 上重测疑似场景并做 final 判定。
  #
  # 为什么必须换 runner：首轮与复测在同一台 VM 上顺序执行时，「整台 runner 变慢」
  # （共享宿主机争用 / VM 放置差异）会让两轮同时超阈值，穿过「连续 2 次」判定——
  # 实测一次慢会话里 88% 的相对行同时变差、中位 Δ +18.7%，而同一份代码在安静时段完全正常。
  # 换 runner 后两轮才统计独立：慢会话通常不会在两台不同 VM 上重现 → 正确落成 WARN「复测回落」。
  #
  # 只在有疑似回归时运行：无嫌疑的常规运行仍只有 1 个 job（不额外付启动与安装成本）。
  retest:
    needs: benchmark
    if: needs.benchmark.outputs.suspects == 'true'
    runs-on: ubuntu-latest
    # 与 benchmark job 同规则：PR 运行不阻断合并；tag 运行必须显式失败（否则红信号被绿勾掩盖）
    continue-on-error: ${{ github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # 上游 job 的产物：首轮采样 + 复测清单 + 基线（判定要用）
      - name: 下载首轮产物
        uses: actions/download-artifact@v7
        with:
          name: perf-benchmark-${{ needs.benchmark.outputs.profile }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright system deps
        shell: bash
        # sudo 会重置 PATH 导致找不到 pnpm，用 sudo env 透传（与 benchmark job 一致）
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: 复测 + final 判定（本 job 的 runner 与首轮不同）
        env:
          PERF_PROFILE: ${{ needs.benchmark.outputs.profile }}
          CI: "true"
          PERF_ABSOLUTE: ${{ github.event.inputs.absolute == 'true' && '1' || '' }}
          PERF_REQUIRE_COMPARISON: ${{ github.ref_type == 'tag' && '1' || '' }}
          PERF_RETEST_ONLY: "1"
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            pnpm run benchmark -- --update-baseline=1
          else
            pnpm run benchmark
          fi

      - name: Upload benchmark artifact（含复测轮与 final 报告）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark-${{ needs.benchmark.outputs.profile }}-retest
          path: |
            .perf-output/
            .perf-baseline/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: 写入 Job Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f .perf-output/report.md ]; then
            {
              echo "## 性能 Benchmark · 独立复测（新 runner，issue #234）"
              echo ""
              cat .perf-output/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ 未生成 .perf-output/report.md（复测 job 未跑完，属 infra 故障）" >> "$GITHUB_STEP_SUMMARY"
          fi
