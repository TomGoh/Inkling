<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Editor Test</title>
</head>
<body>
<div id="test-root"></div>
<script type="module">
import { createRoot } from 'react-dom/client';
import React from 'react';
import { MarkdownEditor } from './src/components/Editor/Editor.tsx';

const sample = `# 测试标题

这是一段普通文字，包含 **加粗** 和 *斜体*。

> 引用块
> 第二行

- 列表项 1
- 列表项 2

\`\`\`js
console.log("代码块");
\`\`\`

| 列1 | 列2 |
|-----|-----|
| a   | b   |

[链接](https://example.com)

![图片](test.png)

$$E = mc^2$$

> [!WARNING]
> 这是一个 callout
`;

function TestApp() {
  const [val, setVal] = React.useState(sample);
  return React.createElement(MarkdownEditor, {
    value: val,
    onChange: setVal,
  });
}

createRoot(document.getElementById('test-root')).render(
  React.createElement(React.StrictMode, null, React.createElement(TestApp))
);
</script>
</body>
</html>
